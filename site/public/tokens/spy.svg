<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Solid Dark Background -->
  <rect width="100" height="100" fill="#0A0A0A"/>
  
  <g transform="translate(14, 16)">
    <!-- Official S&P Global Parallelograms (Signature Red Double-Slash) -->
    <path d="M0 0 H24 L14 18 H-10 Z" fill="#EE3124" transform="translate(10, 0)"/>
    <path d="M0 0 H24 L14 18 H-10 Z" fill="#C4122D" transform="translate(32, 0)"/>

    <!-- "S&P" Brand Title -->
    <text x="36" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="-0.5">S&amp;P</text>
    
    <!-- 500 Subtitle Pill -->
    <rect x="10" y="48" width="52" height="18" rx="4" fill="#EE3124" fill-opacity="0.2" stroke="#EE3124" stroke-width="1.5"/>
    <text x="36" y="61.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" letter-spacing="1.5">500</text>
  </g>
</svg>
